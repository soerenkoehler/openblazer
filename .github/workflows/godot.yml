name: Godot

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

concurrency:
  group: godot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      msix_version: ${{ steps.package.outputs.msix_version }}

    steps:
    - name: checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: check deployment script
      run: bash -n ./deploy/deploy.sh

    - name: install tools
      run: ./deploy/deploy.sh install

    - name: package artifacts
      id: package
      run: ./deploy/deploy.sh package

    - name: save artifacts
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: |
          dist/openblazer.exe
          dist/openblazer.x64
          dist/openblazer.msix
        if-no-files-found: error

  nightly:
    if: github.ref_type == 'branch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - uses: actions/download-artifact@v4
      with:
        name: package
        path: dist

    - name: replace nightly release
      run: ./deploy/deploy.sh release
      env:
        GH_TOKEN: "${{ github.token }}"
        DEPLOY_EXPECTED_VERSION: "${{ needs.build.outputs.msix_version }}"

  production:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - uses: actions/download-artifact@v4
      with:
        name: package
        path: dist

    - name: install Microsoft Store CLI
      uses: microsoft/microsoft-store-apppublisher@v1.3

    - name: install Store dependencies
      run: ./deploy/deploy.sh install-store

    - name: publish release
      run: ./deploy/deploy.sh release
      env:
        GH_TOKEN: "${{ github.token }}"
        DEPLOY_EXPECTED_VERSION: "${{ needs.build.outputs.msix_version }}"
        MSSTORE_STORE_ID:        "${{ secrets.STORE_ID                 }}"
        MSSTORE_SELLER_ID:       "${{ secrets.SELLER_ID                }}"
        MSSTORE_TENANT_ID:       "${{ secrets.TENANT_ID                }}"
        MSSTORE_CLIENT_ID:       "${{ secrets.CLIENT_ID                }}"
        MSSTORE_CLIENT_SECRET:   "${{ secrets.CLIENT_SECRET            }}"
